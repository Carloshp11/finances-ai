[project]
name = "finanzas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos De Las Heras Peña", email = "carloshp11@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-otel>=0.17.3",
    "langchain-core>=1.8.1",
    "langgraph>=1.2.22",
    "openinference-instrumentation-langchain>=0.1.87",
    "pandas>=2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-calamine>=0.9.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
finanzas = "finanzas.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
